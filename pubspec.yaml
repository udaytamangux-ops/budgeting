name: budgeting_app
description: A mobile-first NPR budgeting application for young professionals in Nepal.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  bikram_sambat: 1.2.0
  drift: 2.31.0
  drift_flutter: 0.2.8
  file_picker: 10.3.10
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^17.3.0
  intl: ^0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5
  drift_dev: 2.31.0
  build_runner: ^2.6.0

flutter:
  uses-material-design: true
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
